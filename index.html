<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle Financeiro & Dashboard</title>
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  </head>
  <body>
    <header>
      <h1>Meu Controle Financeiro</h1>
      <p>Painel de controle e distribuição de gastos</p>
    </header>

    <main>
      <!-- Configuração de Renda e Indicadores (Dashboard) -->
      <section class="dashboard-container">
        <!-- Card de Configuração de Renda -->
        <div class="card config-card">
          <h3>Renda Mensal</h3>
          <!-- Modifique o input para incluir o aria-label -->
          <div class="input-group">
            <input
              type="number"
              id="input-renda"
              aria-label="Valor da Renda Mensal"
              placeholder="Ex: 1518.00"
              step="0.01"
            />
            <button id="btn-salvar-renda">Salvar Renda</button>
          </div>
        </div>

        <div class="cards-resumo" id="dashboard-resumo">
          <div
            class="card metric"
            id="card-renda"
            
            tabindex="0"
            aria-labelledby="label-renda val-renda"
          >
            <span id="label-renda">Renda Total</span>
            <h2 id="val-renda">R$ 0,00</h2>
          </div>

          <div
            class="card metric"
            id="card-gastos"
            
            tabindex="0"
            aria-labelledby="label-gastos val-gastos"
          >
            <span id="label-gastos">Total Gasto</span>
            <h2 id="val-gastos">R$ 0,00</h2>
          </div>

          <div
            class="card metric"
            id="card-saldo"
            
            tabindex="0"
            aria-labelledby="label-saldo"
          >
            <span id="label-saldo">Saldo Restante</span>
            <h2 id="val-saldo">R$ 0,00</h2>
          </div>

          <div
            class="card metric"
            id="card-porcentagem"
            
            tabindex="0"
            aria-labelledby="label-porcentagem val-porcentagem"
          >
            <span id="label-porcentagem">Comprometido</span>
            <h2 id="val-porcentagem">0%</h2>
          </div>
        </div>

        <!-- Região para anunciar atualizações ao leitor de tela -->
        <div
          id="anuncio-dashboard"
          class="sr-only"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </section>

      <!-- Formulário para Adicionar Despesa -->
      <section class="form-container">
        <h3>Adicionar Nova Despesa</h3>
        <form id="form-transacao">
          <div class="field">
            <label for="descricao">Descrição</label>
            <input
              type="text"
              id="descricao"
              placeholder="Ex: Supermercado, Aluguel..."
              required
            />
          </div>

          <div class="field">
            <label for="valor">Valor (R$)</label>
            <input
              type="number"
              id="valor"
              placeholder="0.00"
              step="0.01"
              required
            />
          </div>

          <div class="field">
            <label for="categoria">Categoria</label>
            <select id="categoria" required>
              <option value="">Selecione...</option>
              <option value="Moradia">Moradia</option>
              <option value="Alimentação">Alimentação</option>
              <option value="Transporte">Transporte</option>
              <option value="Lazer">Lazer</option>
              <option value="Outros">Outros</option>
            </select>
          </div>

          <button type="submit" id="btn-adicionar">Adicionar Gasto</button>
        </form>
      </section>

      <!-- Histórico / Tabela de Transações -->
      <section class="tabela-container">
        <h3>Histórico de Gastos</h3>
        <table>
          <thead>
            <tr>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Valor</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-transacoes">
            <!-- Transações cadastradas -->
            <tr class="vazio">
              <td colspan="4">Nenhum gasto cadastrado ainda.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="./Script/script.js"></script>
  </body>
</html>
